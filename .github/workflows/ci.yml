name: CI
on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'release-'
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Tests"
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts' # julia lts
          - '1' # latest stable 1.x release of Julia
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # macOS and Windows only with the latest Julia version
        exclude:
          - {version: 'lts', os: macos-latest}
          - {version: 'lts', os: windows-latest}
    uses: "QuantumKitHub/QuantumKitHubActions/.github/workflows/Tests.yml@main"
    with:
      julia-version: "${{ matrix.version }}"
      os: "${{ matrix.os }}"
      nthreads: 4
      timeout-minutes: 90
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-nightly:
    needs: test
    name: "Tests (nightly)"
    uses: "QuantumKitHub/QuantumKitHubActions/.github/workflows/Tests.yml@main"
    with:
      julia-version: "nightly"
      nthreads: 4
      timeout-minutes: 90
      coverage: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
