name: CI
on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'release-'
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Tests"
    uses: "QuantumKitHub/QuantumKitHubActions/.github/workflows/TestGroups.yml@main"
    with:
      fast: ${{ github.event.pull_request.draft == true }}
      nthreads: 4
      timeout-minutes: 90
      # Enzyme plays a large role here, so also test macOS and Windows on PRs, once ubuntu passes
      extra-os-on-prs: true
      staged: ${{ github.event_name == 'pull_request' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-nightly:
    needs: test
    name: "Tests (nightly)"
    uses: "QuantumKitHub/QuantumKitHubActions/.github/workflows/Tests.yml@main"
    with:
      julia-version: "nightly"
      nthreads: 4
      timeout-minutes: 90
      coverage: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
