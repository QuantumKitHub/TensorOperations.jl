steps:
  - label: "Julia {{matrix.julia}} -- {{matrix.queue}}"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.julia}}"
      - JuliaCI/julia-test#v1
      - JuliaCI/julia-coverage#v1:
          dirs:
            - src
            - ext
    agents:
      queue: "{{matrix.queue}}"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 30
    matrix:
      setup:
        julia:
          - "1.10"
          - "1.13"
        queue:
          - "cuda"
          - "rocm"
